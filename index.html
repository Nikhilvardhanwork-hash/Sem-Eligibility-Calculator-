<!DOCTYPE html>
<html>
<head>
<title>Bec External Exam Eligibility Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;   /* ✅ FIXED */
    padding: 20px;
}

/* Container */
.container {
    width: 100%;
    max-width: 450px;
    background: #ffffff;
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* Heading */
h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 24px;   /* slightly bigger */
    color: #1e3c72;
    font-weight: 600;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 16px;   /* smaller than h1 */
    color: #555;       /* softer color */
    font-weight: normal;
}
/* Label */
label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 14px;
}

/* Input */
input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    background: #1e3c72;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

/* Result */
.result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
}

.pass {
    background: #e6f4ea;
    color: #1e7e34;
}

.fail {
    background: #fdecea;
    color: #c82333;
}

/* Summary Box */
#summaryBox {
    display: none;
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

#midBox, #aatBox {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    background: #e9ecef;
    text-align: center;
}

/* Developer */
.developer-credit {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #777;
    border-top: 1px solid #ccc;
    padding-top: 10px;
}

</style>
</head>

<body>

<div class="container">

<h1>External Eligibility Calculator</h1>

<label>MID-1</label>
<input type="number" id="mid1">

<label>AAT-1</label>
<input type="number" id="aat1">

<label>MID-2</label>
<input type="number" id="mid2">

<label>AAT-2</label>
<input type="number" id="aat2">

<label>Attendance %</label>
<input type="number" id="attendance">

<div style="text-align:center;margin-top:10px;font-size:12px;">
Academic Internal Evaluation System
</div>

<button onclick="calculate()">CHECK ELIGIBILITY</button>

<!-- RESULT -->
<div id="output" class="result"></div>

<!-- SUMMARY -->
<div id="summaryBox">
    <div id="midBox">
        <b>MID Total</b><br>
        <span id="midTotal"></span>/60
    </div>

    <div id="aatBox">
        <b>AAT Total</b><br>
        <span id="aatTotal"></span>/20
    </div>
</div>

<!-- DEVELOPER -->
<div class="developer-credit">
    <i>Developed by k.Nikhil Vardhan Dept of Data Science-II</i>
</div>

</div>

<script>

function calculate() {

let mid1 = parseFloat(document.getElementById("mid1").value) || 0;
let mid2 = parseFloat(document.getElementById("mid2").value) || 0;
let aat1 = parseFloat(document.getElementById("aat1").value) || 0;
let aat2 = parseFloat(document.getElementById("aat2").value) || 0;
let attendance = parseFloat(document.getElementById("attendance").value) || 0;

let output = document.getElementById("output");

// Attendance rule
if(attendance < 75) {
    output.className = "result fail";
    output.innerHTML = "Minimum 75% attendance required.";
    return;
}

// Totals
let midTotal = mid1 + mid2;
let aatTotal = aat1 + aat2;

// Show summary
document.getElementById("summaryBox").style.display = "flex";
document.getElementById("midTotal").innerText = midTotal;
document.getElementById("aatTotal").innerText = aatTotal;

// Highlight
let midBox = document.getElementById("midBox");
let aatBox = document.getElementById("aatBox");

midBox.style.background = "#e9ecef";
aatBox.style.background = "#e9ecef";

if (midTotal > aatTotal) {
    midBox.style.background = "#e6f4ea";
    aatBox.style.background = "#fdecea";
} else if (aatTotal > midTotal) {
    aatBox.style.background = "#e6f4ea";
    midBox.style.background = "#fdecea";
}

// Final calc
let total = midTotal + aatTotal;
let bonus = attendance >= 80 ? 4 : 3;

let totalWithBonus = Math.min(total + bonus, 80);
let finalMarks = (totalWithBonus / 80) * 40;

// Result
if(finalMarks >= 20) {

    output.className = "result pass";

    output.innerHTML =
    "<div style='font-size:14px;'><b>Internal Total:</b> <b>" + totalWithBonus + "/80</b></div>" +

    "<div style='font-size:18px; margin:8px 0;'><b>Final Marks:</b> <b>" + finalMarks.toFixed(2) + "/40</b></div>" +

    "<hr style='margin:10px 0'>" +

    "<div style='font-size:22px; font-weight:bold; color:#1e7e34;'>STATUS: ELIGIBLE FOR SEM</div>";

}
else {

    output.className = "result fail";

    output.innerHTML =
    "<div style='font-size:14px;'>Internal Total: <b>" + totalWithBonus + "/80</b></div>" +

    "<div style='font-size:18px; margin:8px 0;'>Final Marks: <b>" + finalMarks.toFixed(2) + "/40</b></div>" +

    "<hr style='margin:10px 0'>" +

    "<div style='font-size:22px; font-weight:bold; color:#c82333;'>STATUS: NOT ELIGIBLE FOR SEM</div>";

}

}

</script>

</body>
</html>
